<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img" aria-label="Tech header accent">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#F9A8D4" stroke-width="0.4" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="900" height="72" rx="10" fill="url(#bg)"/>
  <rect width="900" height="72" rx="10" fill="url(#grid)"/>
  <rect width="900" height="34" rx="10" fill="url(#shine)"/>

  <!-- PCB traces — left -->
  <g stroke="#F9A8D4" stroke-width="1.5" fill="none" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 36 H80 M80 36 L92 22 M92 22 H148 M148 22 L160 36 M160 36 H220"/>
    <path d="M24 48 H64 M64 48 L76 58 M76 58 H132"/>
    <path d="M48 18 H104 M104 18 L116 30 M116 30 H168"/>
  </g>
  <g fill="#FBCFE8" fill-opacity="0.9">
    <circle cx="80" cy="36" r="2.5"/><circle cx="148" cy="22" r="2"/><circle cx="160" cy="36" r="2.5"/>
    <circle cx="64" cy="48" r="2"/><circle cx="116" cy="30" r="2"/>
  </g>

  <!-- PCB traces — right -->
  <g stroke="#F9A8D4" stroke-width="1.5" fill="none" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M876 36 H820 M820 36 L808 22 M808 22 H752 M752 22 L740 36 M740 36 H680"/>
    <path d="M876 48 H836 M836 48 L824 58 M824 58 H768"/>
    <path d="M852 18 H796 M796 18 L784 30 M784 30 H732"/>
  </g>
  <g fill="#FBCFE8" fill-opacity="0.9">
    <circle cx="820" cy="36" r="2.5"/><circle cx="752" cy="22" r="2"/><circle cx="740" cy="36" r="2.5"/>
    <circle cx="836" cy="48" r="2"/><circle cx="784" cy="30" r="2"/>
  </g>

  <!-- Center IC -->
  <g transform="translate(418, 20)">
    <rect x="0" y="0" width="64" height="32" rx="4" fill="#3B0764" stroke="#F9A8D4" stroke-width="1.5" stroke-opacity="0.75"/>
    <text x="32" y="21" text-anchor="middle" fill="#FDF4FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" opacity="0.95">&lt;/&gt;</text>
    <g stroke="#E879F9" stroke-width="1.5" stroke-opacity="0.85">
      <line x1="-10" y1="8" x2="0" y2="8"/><line x1="-10" y1="16" x2="0" y2="16"/><line x1="-10" y1="24" x2="0" y2="24"/>
      <line x1="64" y1="8" x2="74" y2="8"/><line x1="64" y1="16" x2="74" y2="16"/><line x1="64" y1="24" x2="74" y2="24"/>
      <line x1="16" y1="-10" x2="16" y2="0"/><line x1="32" y1="-10" x2="32" y2="0"/><line x1="48" y1="-10" x2="48" y2="0"/>
      <line x1="16" y1="32" x2="16" y2="42"/><line x1="32" y1="32" x2="32" y2="42"/><line x1="48" y1="32" x2="48" y2="42"/>
    </g>
  </g>

  <!-- Bus lines -->
  <line x1="220" y1="36" x2="418" y2="36" stroke="#F9A8D4" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 3"/>
  <line x1="482" y1="36" x2="680" y2="36" stroke="#F9A8D4" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 3"/>
</svg>
